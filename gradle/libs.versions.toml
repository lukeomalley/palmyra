[versions]
agp = "9.4.1"
kotlin = "2.4.21"
gradle = "9.8.2"
spotless = "8.0.0"
detekt = "1.23.8"
roborazzi = "1.76.0"
robolectric = "4.17"
junit = "4.13.2"
[plugins]
android = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
